<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ANDUOR</title>
<style>
body{margin:0;font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#24143A;color:#F5F3F9;display:flex;align-items:center;justify-content:center;min-height:100%;padding:64px 20px;box-sizing:border-box;text-align:center}
html{height:100%}
h1{font-size:28px;margin:0 0 8px;letter-spacing:.04em}
p{margin:0 0 24px;font-size:15px;line-height:24px}
a{display:inline-block;padding:10px 22px;border-radius:9999px;background:#F4B223;color:#1E1431;font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid #F5F3F9;outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>ANDUOR</h1>
<p>404 · Không tìm thấy trang / Page not found</p>
<a id="home" href="./index.html">Trang chủ / Home</a>
</main>
<script>
/* GitHub Pages trả trang này cho mọi đường dẫn sai, kể cả thư mục con: tính lại gốc trang. */
(function () {
  var p = location.pathname, base = '/';
  if (/\.github\.io$/i.test(location.hostname)) { var m = /^\/[^\/]+\//.exec(p); if (m) base = m[0]; }
  document.getElementById('home').href = base + 'index.html';
})();
</script>
</body>
</html>
